name: digikhata_clone
description: "Digital Business Ledger & Accounting System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend & Auth
  supabase_flutter: ^2.8.0
  firebase_core: ^3.10.0
  firebase_messaging: ^15.2.10

  # State Management & Routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.0

  # Local Storage & Offline Database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6

  # UI Components & Theme
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  intl: ^0.20.2
  font_awesome_flutter: ^11.0.0

  # Utilities (Export & QR)
  pdf: ^3.11.1
  printing: ^5.13.4
  excel: ^4.0.6
  qr_flutter: ^4.1.0
  local_auth: ^3.0.2 # Biometrics
  fl_chart: ^1.2.0
  permission_handler: ^12.0.3
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  pinput: ^6.0.2
  sms_autofill: ^2.5.0
  flutter_localizations:
    sdk: flutter
  camera: ^0.12.0+2
  google_generative_ai: ^0.4.7
  flutter_tts: ^4.2.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/