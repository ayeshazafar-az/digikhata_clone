name: digikhata_clone
description: "Digital Business Ledger & Accounting System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend & Auth
  supabase_flutter: ^2.8.0
  firebase_core: ^3.10.0
  firebase_messaging: ^15.2.0

  # State Management & Routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.0

  # Local Storage & Offline Database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  shared_preferences: ^2.3.5

  # UI Components & Theme
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  intl: ^0.20.2
  font_awesome_flutter: ^10.8.0

  # Utilities (Export & QR)
  pdf: ^3.11.1
  printing: ^5.13.4
  excel: ^4.0.6
  qr_flutter: ^4.1.0
  local_auth: ^2.3.0 # Biometrics

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/